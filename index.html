<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Faiaz Iftakhar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Vazirmatn", "Inter", "sans-serif"],
              en: ["Inter", "sans-serif"],
            },
            colors: {
              ink: "#0A0E14",
              slate: "#4A5568",
              mist: "#F4F6F8",
            },
          },
        },
      };
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        min-height: 100%;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Vazirmatn", "Inter", sans-serif;
        background: #f4f6f8;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        position: relative;
        overflow-x: hidden;
        color: #0a0e14;
      }

      /* ─── پس‌زمینه ─── */
      .bg-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-stage::before {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, #0a0e14, transparent 65%);
        opacity: 0.06;
        top: -200px;
        right: -180px;
        filter: blur(70px);
      }
      .bg-stage::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, #0a0e14, transparent 65%);
        opacity: 0.05;
        bottom: -180px;
        left: -160px;
        filter: blur(70px);
      }

      /* ─── کارت ─── */
      .card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);
        border: 1px solid rgba(10, 14, 20, 0.06);
        box-shadow:
          0 1px 2px rgba(10, 14, 20, 0.04),
          0 24px 64px -20px rgba(10, 14, 20, 0.14);
        position: relative;
        z-index: 1;
        border-radius: 24px;
        overflow: hidden;
      }

      /* ═══ Cover Image ═══ */
      .cover {
        position: relative;
        width: 100%;
        height: 130px;
        overflow: hidden;
        background: #e5e8ec;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transition: transform 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      }
      .card:hover .cover img {
        transform: scale(1.05);
      }
      .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 40%,
          rgba(10, 14, 20, 0.04) 70%,
          rgba(255, 255, 255, 0.5) 100%
        );
        pointer-events: none;
      }

      /* ─── Avatar ─── */
      .avatar-wrap {
        position: relative;
        margin-top: -44px;
        display: flex;
        justify-content: center;
        z-index: 3;
      }
      .avatar {
        background: #ffffff;
        border: 3.5px solid #ffffff;
        box-shadow:
          0 1px 2px rgba(10, 14, 20, 0.04),
          0 12px 28px -10px rgba(10, 14, 20, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 1);
        position: relative;
        overflow: hidden;
        display: block;
        width: 88px;
        height: 88px;
        border-radius: 50%;
      }
      .avatar::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(10, 14, 20, 0.08);
        animation: breathe 3.5s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.05);
          opacity: 0;
        }
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .avatar:hover img {
        transform: scale(1.06);
      }

      /* ─── Name ─── */
      .name {
        font-family: "Inter", "Vazirmatn", sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0a0e14;
      }

      /* ─── دکمه‌ها ─── */
      .btn-dark {
        background: #0a0e14;
        color: #ffffff;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 20px -8px rgba(10, 14, 20, 0.4);
      }
      .btn-dark:hover {
        background: #1a2230;
        transform: translateY(-2px);
        box-shadow: 0 14px 28px -10px rgba(10, 14, 20, 0.45);
      }
      .btn-dark:active {
        transform: translateY(0) scale(0.98);
      }

      .btn-light {
        background: #ffffff;
        color: #0a0e14;
        border: 1px solid rgba(10, 14, 20, 0.1);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 12px -4px rgba(10, 14, 20, 0.06);
      }
      .btn-light:hover {
        border-color: rgba(10, 14, 20, 0.25);
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px rgba(10, 14, 20, 0.15);
      }
      .btn-light:active {
        transform: translateY(0) scale(0.98);
      }

      /* ─── جداکننده ─── */
      .divider {
        height: 1px;
        background: rgba(10, 14, 20, 0.07);
      }

      /* ═══ گرید دو ستونی ═══ */
      .brand-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .brand-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 11px 6px;
        border-radius: 14px;
        border: 1px solid rgba(10, 14, 20, 0.06);
        background: #ffffff;
        transition: all 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
        position: relative;
        overflow: hidden;
        text-decoration: none;
        box-shadow: 0 1px 2px rgba(10, 14, 20, 0.03);
      }

      .brand-card::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.4s ease;
        background: var(--brand-color);
      }

      .brand-card:hover {
        transform: translateY(-3px);
        border-color: var(--brand-color);
        box-shadow:
          0 12px 28px -12px var(--brand-shadow),
          0 4px 10px -4px rgba(10, 14, 20, 0.08);
      }
      .brand-card:hover::before {
        opacity: 1;
      }
      .brand-card:active {
        transform: translateY(-1px) scale(0.98);
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
        position: relative;
        z-index: 1;
        background: var(--brand-bg);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .brand-icon i {
        font-size: 17px;
        color: var(--brand-color);
        transition: all 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
      }

      .brand-card:hover .brand-icon {
        background: rgba(255, 255, 255, 0.22);
        transform: scale(1.05);
      }
      .brand-card:hover .brand-icon i {
        color: #ffffff;
        transform: scale(1.12);
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        position: relative;
        z-index: 1;
        text-align: center;
        line-height: 1.2;
        width: 100%;
      }
      .brand-fa {
        font-size: 11px;
        font-weight: 600;
        color: #0a0e14;
        transition: color 0.4s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .brand-en {
        font-size: 9px;
        font-weight: 500;
        color: var(--brand-color);
        font-family: "Inter", sans-serif;
        letter-spacing: 0.02em;
        transition: color 0.4s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        opacity: 0.85;
      }
      .brand-card:hover .brand-fa {
        color: #ffffff;
      }
      .brand-card:hover .brand-en {
        color: rgba(255, 255, 255, 0.85);
        opacity: 1;
      }

      /* ─── ورود پله‌ای ─── */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      .rise {
        animation: rise 0.75s cubic-bezier(0.34, 1.2, 0.64, 1) both;
      }
      .r1 {
        animation-delay: 0.05s;
      }
      .r2 {
        animation-delay: 0.12s;
      }
      .r3 {
        animation-delay: 0.19s;
      }
      .r4 {
        animation-delay: 0.26s;
      }
      .r5 {
        animation-delay: 0.33s;
      }
      .r6 {
        animation-delay: 0.4s;
      }
      .r7 {
        animation-delay: 0.47s;
      }
      .r8 {
        animation-delay: 0.54s;
      }
      .r9 {
        animation-delay: 0.61s;
      }

      /* ─── تنظیم ارتفاع برای موبایل ─── */
      @media (max-height: 740px) {
        body {
          padding: 8px;
          align-items: flex-start;
        }
        .card {
          border-radius: 20px;
        }
        .cover {
          height: 110px;
        }
        .avatar-wrap {
          margin-top: -38px;
        }
        .avatar {
          width: 78px !important;
          height: 78px !important;
        }
        .quote-block {
          padding-top: 12px !important;
          padding-bottom: 2px !important;
        }
        .name-block {
          padding-top: 8px !important;
          padding-bottom: 0 !important;
        }
        .name {
          font-size: 19px !important;
        }
        .spacer {
          height: 10px !important;
        }
        .btn-row a {
          padding-top: 9px !important;
          padding-bottom: 9px !important;
        }
        .divider-wrap {
          margin-top: 12px !important;
        }
        .social-label {
          padding-top: 8px !important;
          padding-bottom: 6px !important;
        }
        .brand-card {
          padding: 8px 5px;
          gap: 5px;
        }
        .brand-icon {
          width: 34px;
          height: 34px;
          border-radius: 10px;
        }
        .brand-icon i {
          font-size: 15px;
        }
        .brand-fa {
          font-size: 10.5px;
        }
        .brand-en {
          font-size: 8.5px;
        }
        .footer {
          padding-top: 10px !important;
          padding-bottom: 10px !important;
        }
      }

      @media (max-height: 640px) {
        body {
          padding: 6px;
        }
        .cover {
          height: 95px;
        }
        .avatar-wrap {
          margin-top: -32px;
        }
        .avatar {
          width: 68px !important;
          height: 68px !important;
        }
        .name {
          font-size: 17px !important;
        }
        .brand-icon {
          width: 30px;
          height: 30px;
        }
        .brand-icon i {
          font-size: 14px;
        }
        .brand-card {
          padding: 6px 4px;
          gap: 4px;
        }
        .brand-fa {
          font-size: 10px;
        }
        .brand-en {
          font-size: 8px;
        }
        .brand-grid {
          gap: 7px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-stage"></div>

    <div class="card w-full max-w-sm rise" style="max-width: 350px">
      <!-- Cover -->
      <div class="cover rise r1">
        <img src="photo_2026-10-24_10-09-43.jpg" alt="Cover" loading="eager" />
      </div>

      <!-- Avatar -->
      <div class="avatar-wrap rise r2">
        <div class="avatar">
          <img
            src="WhatsApp%20Image%202026-10-22%20at%204.24.15%20PM.jpeg"
            alt="Faiaz Iftakhar"
            loading="eager"
          />
        </div>
      </div>

      <!-- Name -->
      <div class="text-center px-6 pt-3 pb-0.5 rise r3 name-block">
        <h1 class="name text-[20px] leading-tight">Faiaz Iftakhar</h1>
        <p
          class="text-[8.5px] text-slate mt-1 tracking-[0.32em] uppercase font-medium font-en"
        >
          Personal Profile
        </p>
      </div>

      <!-- Quote -->
      <div class="px-6 pt-3 pb-1 text-center rise r3 quote-block">
        <p class="text-[11.5px] text-slate leading-relaxed font-light">
          «بهترین نسخه از خودت را بساز.»
        </p>
      </div>

      <div class="h-4 spacer"></div>

      <!-- Buttons -->
      <div class="flex gap-2 px-4 rise r4 btn-row">
        <a
          href="tel:0784040294"
          class="btn-dark flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[11.5px] font-semibold"
        >
          <i class="fa-solid fa-phone text-[10px]"></i>
          <span>تماس</span>
        </a>
        <a
          href="mailto:fayazaftkar4040@gmail.com"
          class="btn-light flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[11.5px] font-semibold"
        >
          <i class="fa-solid fa-envelope text-[10px]"></i>
          <span>ایمیل</span>
        </a>
      </div>

      <div class="divider mt-4 mx-6 rise r4 divider-wrap"></div>

      <!-- Social Label -->
      <div class="pt-3 pb-2 px-6 rise r5 social-label">
        <p
          class="text-[8.5px] text-slate tracking-[0.35em] uppercase font-medium font-en"
        >
          Connect
        </p>
      </div>

      <!-- Grid دو ستونی — فقط ۵ شبکه -->
      <div class="px-3.5 pb-1 rise r5">
        <div class="brand-grid">
          <!-- واتساپ — شماره اصلاح‌شده -->
          <a
            href="https://wa.me/93784040294"
            target="_blank"
            class="brand-card rise r6"
            style="
              --brand-color: #25d366;
              --brand-bg: rgba(37, 211, 102, 0.12);
              --brand-shadow: rgba(37, 211, 102, 0.5);
            "
          >
            <div class="brand-icon">
              <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div class="brand-text">
              <div class="brand-fa">واتساپ</div>
              <div class="brand-en">WhatsApp</div>
            </div>
          </a>

          <!-- یوتیوب -->
          <a
            href="https://www.youtube.com/@abrishamtv"
            target="_blank"
            class="brand-card rise r6"
            style="
              --brand-color: #ff0000;
              --brand-bg: rgba(255, 0, 0, 0.1);
              --brand-shadow: rgba(255, 0, 0, 0.45);
            "
          >
            <div class="brand-icon">
              <i class="fa-brands fa-youtube"></i>
            </div>
            <div class="brand-text">
              <div class="brand-fa">یوتیوب</div>
              <div class="brand-en">YouTube</div>
            </div>
          </a>

          <!-- تیک‌تاک -->
          <a
            href="https://www.tiktok.com/@fayaz.eftakhar"
            target="_blank"
            class="brand-card rise r7"
            style="
              --brand-color: #000000;
              --brand-bg: rgba(0, 0, 0, 0.06);
              --brand-shadow: rgba(37, 244, 238, 0.5);
            "
          >
            <div class="brand-icon">
              <i class="fa-brands fa-tiktok"></i>
            </div>
            <div class="brand-text">
              <div class="brand-fa">تیک‌تاک</div>
              <div class="brand-en">TikTok</div>
            </div>
          </a>

          <!-- فیسبوک -->
          <a
            href="https://www.facebook.com/share/1atP3gjfoe/?mibextid=wwXIfr"
            target="_blank"
            class="brand-card rise r7"
            style="
              --brand-color: #1877f2;
              --brand-bg: rgba(24, 119, 242, 0.1);
              --brand-shadow: rgba(24, 119, 242, 0.5);
            "
          >
            <div class="brand-icon">
              <i class="fa-brands fa-facebook-f"></i>
            </div>
            <div class="brand-text">
              <div class="brand-fa">فیسبوک</div>
              <div class="brand-en">Facebook</div>
            </div>
          </a>

          <!-- اینستاگرام (تنها، وسط‌چین) -->
          <a
            href="#"
            target="_blank"
            class="brand-card rise r8 opacity-50"
            style="
              grid-column: 1 / -1;
              --brand-color: #e1306c;
              --brand-bg: linear-gradient(
                135deg,
                rgba(245, 133, 41, 0.12),
                rgba(221, 42, 123, 0.12),
                rgba(129, 52, 175, 0.12)
              );
              --brand-shadow: rgba(221, 42, 123, 0.5);
            "
          >
            <div
              class="brand-icon"
              style="
                background: linear-gradient(
                  135deg,
                  rgba(245, 133, 41, 0.15),
                  rgba(221, 42, 123, 0.15),
                  rgba(129, 52, 175, 0.15)
                );
              "
            >
              <i
                class="fa-brands fa-instagram"
                style="
                  background: linear-gradient(
                    135deg,
                    #f58529,
                    #dd2a7b,
                    #8134af
                  );
                  -webkit-background-clip: text;
                  background-clip: text;
                  -webkit-text-fill-color: transparent;
                "
              ></i>
            </div>
            <div class="brand-text">
              <div class="brand-fa">اینستاگرام</div>
              <div class="brand-en">Instagram</div>
            </div>
          </a>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center py-3.5 rise r9 footer">
        <p
          class="text-[8.5px] text-slate/60 tracking-[0.25em] font-en font-medium"
        >
          © 2026 · Faiaz Iftakhar
        </p>
      </div>
    </div>
  </body>
</html>
